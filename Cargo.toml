[package]
name = "vita49-chaos"
version = "0.5.2"
edition = "2021"
description = "Native VITA-49/VRT chaos engineering workbench for RF collection systems"
license = "MIT"

[features]
default = []
native-pcap = ["dep:pcap"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = { version = "0.27.2", default-features = false, features = ["default_fonts", "glow", "x11"] }
egui_plot = "0.27.2"
hex = "0.4"
num-complex = { version = "0.4", features = ["serde"] }
rand = "0.8.5"
rand_chacha = "0.3"
rand_distr = "0.4"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
pcap = { version = "1.3", optional = true }
socket2 = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = true
